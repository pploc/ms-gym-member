name: CI

on:
  push:
    branches: [develop, main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

jobs:
  java-ci:
    name: Lint, tests, coverage
    uses: pploc/gym-infra/.github/workflows/java-ci.yml@develop
    with:
      service_path: .
      java_version: '26'
      gradle_args: check
    secrets: inherit

  docker:
    name: Build & push image
    needs: java-ci
    if: >
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    uses: pploc/gym-infra/.github/workflows/docker-build.yml@develop
    with:
      service_name: ms-gym-member
      context: .
      push: true
      max_tags: 20
    secrets: inherit
    permissions:
      contents: read
      packages: write
