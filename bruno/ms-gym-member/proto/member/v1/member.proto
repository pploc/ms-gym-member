syntax = "proto3";

package member.v1;

option go_package = "github.com/gym-chain/proto-go/member/v1;memberv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.member.v1";

service MemberService {
  rpc GetMember(GetMemberRequest) returns (MemberResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (MemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  rpc GetPlans(GetPlansRequest) returns (PlansResponse);
  rpc PurchaseMembership(PurchaseMembershipRequest) returns (PurchaseResponse);
  rpc PauseMembership(PauseMembershipRequest) returns (MembershipResponse);
  rpc ResumeMembership(ResumeMembershipRequest) returns (MembershipResponse);
  rpc GetMembershipStatus(GetMembershipStatusRequest) returns (MembershipResponse);

  rpc CreateGymLocation(CreateGymLocationRequest) returns (GymLocationResponse);
  rpc UpdateGymLocation(UpdateGymLocationRequest) returns (GymLocationResponse);
  rpc ListGymLocations(ListGymLocationsRequest) returns (GymLocationsResponse);
  rpc GetGymLocation(GetGymLocationRequest) returns (GymLocationResponse);

  rpc ValidateMembership(ValidateMembershipRequest) returns (ValidateMembershipResponse);
  rpc GetGymDailySecret(GetGymDailySecretRequest) returns (GymDailySecretResponse);
  rpc ListMembersByStatus(ListMembersByStatusRequest) returns (ListMembersByStatusResponse);
}

message GetMemberRequest {
  string member_id = 1;
}

message MemberResponse {
  string id = 1;
  string user_id = 2;
  string gym_id = 3;
  string full_name = 4;
  string phone = 5;
  string avatar_url = 6;
  string emergency_contact = 7;
  string status = 8;
}

message UpdateProfileRequest {
  string member_id = 1;
  string full_name = 2;
  string phone = 3;
  string avatar_url = 4;
  string emergency_contact = 5;
}

message ListMembersRequest {
  int32 page = 1;
  int32 limit = 2;
  string gym_id = 3;
}

message ListMembersResponse {
  repeated MemberResponse members = 1;
  int32 total = 2;
}

message GetPlansRequest {
  string gym_id = 1;
}

message Plan {
  string id = 1;
  string name = 2;
  string plan_type = 3;
  int32 duration_days = 4;
  int64 price_vnd = 5;
  string description = 6;
  bool active = 7;
}

message PlansResponse {
  repeated Plan plans = 1;
}

message PurchaseMembershipRequest {
  string plan_id = 1;
  string provider = 2; // MOMO, ZALOPAY, VNPAY
  string discount_code = 3;
}

message PurchaseResponse {
  string payment_url = 1;
  string payment_id = 2;
}

message PauseMembershipRequest {
  string member_id = 1;
}

message ResumeMembershipRequest {
  string member_id = 1;
}

message GetMembershipStatusRequest {
  string member_id = 1;
}

message MembershipResponse {
  string member_id = 1;
  string status = 2;
  string start_date = 3;
  string end_date = 4;
  int32 remaining_days = 5;
}

message CreateGymLocationRequest {
  string chain_id = 1;
  string name = 2;
  string address = 3;
  string city = 4;
}

message GymLocationResponse {
  string id = 1;
  string chain_id = 2;
  string name = 3;
  string address = 4;
  string city = 5;
  string status = 6;
}

message UpdateGymLocationRequest {
  string id = 1;
  string name = 2;
  string address = 3;
  string city = 4;
  string status = 5;
}

message ListGymLocationsRequest {
  string chain_id = 1;
}

message GymLocationsResponse {
  repeated GymLocationResponse locations = 1;
}

message GetGymLocationRequest {
  string id = 1;
}

message ValidateMembershipRequest {
  string member_id = 1;
  string gym_id = 2;
}

message ValidateMembershipResponse {
  bool valid = 1;
  string status = 2;
}

message GetGymDailySecretRequest {
  string gym_id = 1;
}

message GymDailySecretResponse {
  string daily_secret = 1;
}

message ListMembersByStatusRequest {
  string status = 1;
  repeated string gym_ids = 2;
}

message ListMembersByStatusResponse {
  repeated MemberResponse members = 1;
}
