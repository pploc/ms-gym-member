syntax = "proto3";

package analytics.v1;

option go_package = "github.com/gym-chain/proto-go/analytics/v1;analyticsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.analytics.v1";

service AnalyticsService {
  rpc GetDailyAttendance(AttendanceRequest) returns (AttendanceResponse);
  rpc GetAttendanceTrend(TrendRequest) returns (TrendResponse);
  rpc GetMembershipStats(MembershipStatsRequest) returns (MembershipStatsResponse);
  rpc GetInactiveMembers(InactiveMembersRequest) returns (InactiveMembersResponse);
  rpc GetRevenueReport(RevenueRequest) returns (RevenueResponse);
  rpc GetRevenueComparison(RevenueComparisonRequest) returns (RevenueComparisonResponse);
  rpc GetTrainerUtilization(TrainerUtilizationRequest) returns (TrainerUtilizationResponse);
  rpc GetDashboardSummary(DashboardRequest) returns (DashboardSummaryResponse);
}

message AttendanceRequest {
  string gym_id = 1;
  string start_date = 2; // "2024-12-01"
  string end_date = 3;   // "2024-12-07"
}

message DailyAttendance {
  string date = 1;
  int32 total_checkins = 2;
  int32 unique_members = 3;
  int32 peak_hour = 4;
}

message AttendanceResponse {
  repeated DailyAttendance attendance = 1;
}

message TrendRequest {
  string gym_id = 1;
  int32 days = 2; // e.g. 7 or 30
}

message TrendPoint {
  string date = 1;
  int32 count = 2;
  double change_pct = 3;
}

message TrendResponse {
  repeated TrendPoint points = 1;
}

message MembershipStatsRequest {
  string gym_id = 1;
  string date = 2;
}

message MembershipStatsResponse {
  string date = 1;
  int32 active_count = 2;
  int32 paused_count = 3;
  int32 expired_count = 4;
  int32 new_count = 5;
  int32 churned_count = 6;
}

message InactiveMembersRequest {
  string gym_id = 1;
  int32 inactive_days_threshold = 2; // default 14
}

message InactiveMember {
  string member_id = 1;
  string full_name = 2;
  string phone = 3;
  string last_checkin = 4;
  int32 inactive_days = 5;
  string risk_level = 6; // AT_RISK, INACTIVE, GHOST
}

message InactiveMembersResponse {
  repeated InactiveMember members = 1;
}

message RevenueRequest {
  string gym_id = 1;
  string month = 2; // "2024-12"
}

message RevenueResponse {
  int64 total_revenue_vnd = 1;
  int64 membership_revenue_vnd = 2;
  int64 trainer_revenue_vnd = 3;
}

message RevenueComparisonRequest {
  string gym_id = 1;
  int32 months = 2; // comparison across N months
}

message RevenueComparisonResponse {
  message MonthlyRevenue {
    string month = 1;
    int64 total = 2;
  }
  repeated MonthlyRevenue revenue_history = 1;
}

message TrainerUtilizationRequest {
  string trainer_id = 1;
  string month = 2;
}

message TrainerUtilizationResponse {
  string trainer_id = 1;
  string month = 2;
  int32 total_bookings = 3;
  int32 completed_bookings = 4;
  int32 cancelled_bookings = 5;
  double total_hours = 6;
  double utilization_pct = 7;
}

message DashboardRequest {
  string gym_id = 1;
}

message DashboardSummaryResponse {
  int32 today_checkins = 1;
  int32 active_members = 2;
  int64 month_revenue_vnd = 3;
  double attendance_trend_pct = 4;
  int32 at_risk_members = 5;
  int32 ghost_members = 6;
}
