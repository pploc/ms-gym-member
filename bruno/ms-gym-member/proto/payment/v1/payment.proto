syntax = "proto3";

package payment.v1;

import "common/v1/common.proto";

option go_package = "github.com/gym-chain/proto-go/payment/v1;paymentv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.payment.v1";

service PaymentService {
  rpc InitiatePayment(InitiatePaymentRequest) returns (InitiatePaymentResponse);
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (PaymentStatusResponse);
  rpc GetSpendingHistory(GetSpendingHistoryRequest) returns (SpendingHistoryResponse);

  rpc RefundPayment(RefundPaymentRequest) returns (RefundResponse);
  rpc GetRevenueReport(RevenueReportRequest) returns (RevenueReportResponse);

  rpc GetPaymentsByUser(GetPaymentsByUserRequest) returns (PaymentsResponse);
}

message InitiatePaymentRequest {
  string gym_id = 1;
  string payment_type = 2; // MEMBERSHIP, TRAINER_BOOKING
  string reference_id = 3; // plan_id or booking_id
  string provider = 4;     // MOMO, ZALOPAY, VNPAY
  string discount_code = 5;
}

message InitiatePaymentResponse {
  string payment_id = 1;
  string payment_url = 2;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
}

message PaymentStatusResponse {
  string payment_id = 1;
  string status = 2; // PENDING, COMPLETED, FAILED, REFUNDED
  int64 amount_vnd = 3;
}

message GetSpendingHistoryRequest {
  string user_id = 1;
  common.v1.PaginationRequest pagination = 2;
}

message Transaction {
  string id = 1;
  string type = 2;
  int64 amount_vnd = 3;
  string status = 4;
  string provider = 5;
  string created_at = 6;
  string description = 7;
}

message SpendingHistoryResponse {
  repeated Transaction transactions = 1;
  common.v1.PaginationResponse pagination = 2;
}

message RefundPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  int32 refund_percentage = 3; // 100, 50
}

message RefundResponse {
  string refund_id = 1;
  string status = 2;
}

message RevenueReportRequest {
  string gym_id = 1;
  string start_date = 2;
  string end_date = 3;
}

message RevenueReportResponse {
  int64 total_revenue_vnd = 1;
  int64 membership_revenue_vnd = 2;
  int64 trainer_revenue_vnd = 3;
}

message GetPaymentsByUserRequest {
  string user_id = 1;
}

message PaymentsResponse {
  repeated Transaction payments = 1;
}
