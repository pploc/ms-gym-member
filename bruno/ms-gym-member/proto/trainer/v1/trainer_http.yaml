type: google.api.Service
config_version: 3

http:
  rules:
    - selector: trainer.v1.TrainerService.SearchTrainers
      get: /api/v1/trainers
    - selector: trainer.v1.TrainerService.GetTrainerProfile
      get: /api/v1/trainers/{id}
    - selector: trainer.v1.TrainerService.GetAvailableSlots
      get: /api/v1/trainers/slots
    - selector: trainer.v1.TrainerService.CreateBooking
      post: /api/v1/bookings
      body: "*"
    - selector: trainer.v1.TrainerService.CancelBooking
      post: /api/v1/bookings/cancel
      body: "*"
    - selector: trainer.v1.TrainerService.GetMyBookings
      get: /api/v1/bookings/my
    - selector: trainer.v1.TrainerService.UpdateMyProfile
      put: /api/v1/trainers/profile
      body: "*"
    - selector: trainer.v1.TrainerService.SetAvailability
      post: /api/v1/trainers/availability
      body: "*"
    - selector: trainer.v1.TrainerService.AcceptBooking
      post: /api/v1/bookings/accept
      body: "*"
    - selector: trainer.v1.TrainerService.RejectBooking
      post: /api/v1/bookings/reject
      body: "*"
    - selector: trainer.v1.TrainerService.CompleteBooking
      post: /api/v1/bookings/complete
      body: "*"
    - selector: trainer.v1.TrainerService.GetCoachingHistory
      get: /api/v1/trainers/coaching/history
