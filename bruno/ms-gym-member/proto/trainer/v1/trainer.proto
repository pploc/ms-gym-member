syntax = "proto3";

package trainer.v1;

option go_package = "github.com/gym-chain/proto-go/trainer/v1;trainerv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.trainer.v1";

service TrainerService {
  rpc SearchTrainers(SearchTrainersRequest) returns (TrainersResponse);
  rpc GetTrainerProfile(GetTrainerProfileRequest) returns (TrainerResponse);
  rpc GetAvailableSlots(GetSlotsRequest) returns (SlotsResponse);
  rpc CreateBooking(CreateBookingRequest) returns (BookingResponse);
  rpc CancelBooking(CancelBookingRequest) returns (BookingResponse);
  rpc GetMyBookings(GetMyBookingsRequest) returns (BookingsResponse);

  rpc UpdateMyProfile(UpdateTrainerProfileRequest) returns (TrainerResponse);
  rpc SetAvailability(SetAvailabilityRequest) returns (AvailabilityResponse);
  rpc AcceptBooking(AcceptBookingRequest) returns (BookingResponse);
  rpc RejectBooking(RejectBookingRequest) returns (BookingResponse);
  rpc CompleteBooking(CompleteBookingRequest) returns (BookingResponse);
  rpc GetCoachingHistory(GetCoachingHistoryRequest) returns (BookingsResponse);

  rpc CreateTrainer(CreateTrainerRequest) returns (TrainerResponse);
  rpc SuspendTrainer(SuspendTrainerRequest) returns (SuspendTrainerResponse);
  rpc ListTrainers(ListTrainersRequest) returns (TrainersResponse);
}

message SearchTrainersRequest {
  string gym_id = 1;
  string specialty = 2; // strength, cardio, yoga, etc.
}

message TrainerResponse {
  string id = 1;
  string user_id = 2;
  string gym_id = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
  repeated string specialties = 7;
  repeated string certifications = 8;
  int64 hourly_rate_vnd = 9;
  string status = 10; // ACTIVE, SUSPENDED, INACTIVE
}

message TrainersResponse {
  repeated TrainerResponse trainers = 1;
}

message GetTrainerProfileRequest {
  string id = 1;
}

message GetSlotsRequest {
  string trainer_id = 1;
  string date = 2; // ISO date "2024-12-15"
}

message SlotsResponse {
  repeated string available_slots = 1; // "09:00", "10:00", etc.
}

message CreateBookingRequest {
  string trainer_id = 1;
  string slot = 2; // "2024-12-15T14:00:00Z"
  string notes = 3;
}

message BookingResponse {
  string booking_id = 1;
  string customer_id = 2;
  string trainer_id = 3;
  string scheduled_at = 4;
  int32 duration_minutes = 5;
  int64 price_vnd = 6;
  string status = 7; // PENDING_PAYMENT, REQUESTED, ACCEPTED, REJECTED, COMPLETED, CANCELLED
  string payment_id = 8;
  string customer_notes = 9;
  string trainer_notes = 10;
  string rejection_reason = 11;
}

message CancelBookingRequest {
  string booking_id = 1;
  string reason = 2;
}

message GetMyBookingsRequest {
  string customer_id = 1;
}

message BookingsResponse {
  repeated BookingResponse bookings = 1;
}

message UpdateTrainerProfileRequest {
  string display_name = 1;
  string avatar_url = 2;
  string bio = 3;
  repeated string specialties = 4;
  repeated string certifications = 5;
}

message AvailabilitySlot {
  int32 day_of_week = 1;
  string start_time = 2; // "08:00"
  string end_time = 3; // "17:00"
  bool is_recurring = 4;
  string specific_date = 5; // "2024-12-15"
  bool is_blocked = 6;
}

message SetAvailabilityRequest {
  repeated AvailabilitySlot slots = 1;
}

message AvailabilityResponse {
  repeated AvailabilitySlot slots = 1;
}

message AcceptBookingRequest {
  string booking_id = 1;
}

message RejectBookingRequest {
  string booking_id = 1;
  string reason = 2;
}

message CompleteBookingRequest {
  string booking_id = 1;
  string notes = 2;
}

message GetCoachingHistoryRequest {
  string trainer_id = 1;
}

message CreateTrainerRequest {
  string user_id = 1;
  string gym_id = 2;
  repeated string specialties = 3;
  int64 hourly_rate = 4;
}

message SuspendTrainerRequest {
  string trainer_id = 1;
}

message SuspendTrainerResponse {
  string trainer_id = 1;
  int32 affected_booking_count = 2;
}

message ListTrainersRequest {
  string gym_id = 1;
}
