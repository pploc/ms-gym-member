syntax = "proto3";

package events.v1;

option go_package = "github.com/gym-chain/proto-go/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message WorkoutLoggedEvent {
  string user_id = 1;
  string workout_id = 2;
  string gym_id = 3;
  int32 exercise_count = 4;
  int32 duration_minutes = 5;
  int64 logged_at = 6;
}
