syntax = "proto3";

package events.v1;

option go_package = "github.com/gym-chain/proto-go/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message MemberAtRiskEvent {
  string member_id = 1;
  string gym_id = 2;
  int32 inactive_days = 3;
  string risk_level = 4; // AT_RISK, INACTIVE, GHOST
}
