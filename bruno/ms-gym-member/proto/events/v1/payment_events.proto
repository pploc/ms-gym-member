syntax = "proto3";

package events.v1;

option go_package = "github.com/gym-chain/proto-go/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message PaymentCompletedEvent {
  string payment_id = 1;
  string user_id = 2;
  string type = 3; // MEMBERSHIP, TRAINER_BOOKING
  string reference_id = 4;
  int64 amount_vnd = 5;
  string provider = 6; // MOMO, ZALOPAY, VNPAY
  string gym_id = 7;
  bool discount_applied = 8;
  int32 discount_percentage = 9;
  int64 timestamp = 10;
}

message PaymentFailedEvent {
  string payment_id = 1;
  string user_id = 2;
  string type = 3;
  string reference_id = 4;
  string gym_id = 5;
  string reason = 6;
  int64 timestamp = 7;
}

message PaymentRefundedEvent {
  string payment_id = 1;
  string user_id = 2;
  string type = 3;
  string reference_id = 4;
  string gym_id = 5;
  int64 refund_amount_vnd = 6;
  string reason = 7;
  int64 timestamp = 8;
}
