syntax = "proto3";

package events.v1;

option go_package = "github.com/gym-chain/proto-go/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message BookingRequestedEvent {
  string booking_id = 1;
  string customer_id = 2;
  string trainer_id = 3;
  int64 scheduled_at = 4;
  int32 duration_minutes = 5;
  string gym_id = 6;
}

message BookingAcceptedEvent {
  string booking_id = 1;
  string customer_id = 2;
  string trainer_id = 3;
  string gym_id = 4;
}

message BookingRejectedEvent {
  string booking_id = 1;
  string customer_id = 2;
  string trainer_id = 3;
  string gym_id = 4;
  string reason = 5;
}

message BookingCompletedEvent {
  string booking_id = 1;
  string trainer_id = 2;
  string customer_id = 3;
  int32 duration_minutes = 4;
  string gym_id = 5;
}

message BookingCancelledEvent {
  string booking_id = 1;
  string customer_id = 2;
  string trainer_id = 3;
  string cancelled_by = 4; // CUSTOMER, TRAINER, SYSTEM
  string reason = 5;
  int32 refund_percentage = 6;
  string gym_id = 7;
}

message BookingExpiredEvent {
  string booking_id = 1;
  string trainer_id = 2;
  string slot = 3;
}

message BookingAutoRejectedEvent {
  string booking_id = 1;
  string customer_id = 2;
  string trainer_id = 3;
  string gym_id = 4;
}

message TrainerCreatedEvent {
  string trainer_id = 1;
  string user_id = 2;
  string gym_id = 3;
  string display_name = 4;
}

message TrainerSuspendedEvent {
  string trainer_id = 1;
  string gym_id = 2;
  int32 affected_booking_count = 3;
}
