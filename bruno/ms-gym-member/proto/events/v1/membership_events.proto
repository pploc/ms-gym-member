syntax = "proto3";

package events.v1;

option go_package = "github.com/gym-chain/proto-go/events/v1;eventsv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.events.v1";

message MembershipActivatedEvent {
  string member_id = 1;
  string user_id = 2;
  string plan_type = 3; // MONTHLY, YEARLY, LIFETIME
  string start_date = 4;
  string end_date = 5; // null for LIFETIME
  string gym_id = 6;
  bool is_renewal = 7;
  int64 timestamp = 8;
}

message MembershipPausedEvent {
  string member_id = 1;
  int64 paused_at = 2;
  int32 remaining_days = 3;
  string gym_id = 4;
}

message MembershipResumedEvent {
  string member_id = 1;
  string new_end_date = 2;
  string gym_id = 3;
}

message MembershipExpiringSoonEvent {
  string member_id = 1;
  string end_date = 2;
  string plan_type = 3;
  string gym_id = 4;
}

message MembershipExpiredEvent {
  string member_id = 1;
  int64 expired_at = 2;
  string gym_id = 3;
}
