type: google.api.Service
config_version: 3

http:
  rules:
    - selector: promotion.v1.PromotionService.CreatePromotion
      post: /api/v1/promotions
      body: "*"
    - selector: promotion.v1.PromotionService.UpdatePromotion
      put: /api/v1/promotions/{promotion_id}
      body: "*"
    - selector: promotion.v1.PromotionService.DisablePromotion
      post: /api/v1/promotions/{promotion_id}/disable
      body: "*"
    - selector: promotion.v1.PromotionService.PublishPromotion
      post: /api/v1/promotions/{promotion_id}/publish
      body: "*"
    - selector: promotion.v1.PromotionService.ListPromotions
      get: /api/v1/promotions
    - selector: promotion.v1.PromotionService.GetPromotionStats
      get: /api/v1/promotions/{promotion_id}/stats
    - selector: promotion.v1.PromotionService.CheckDiscountCode
      get: /api/v1/promotions/check/{code}
