syntax = "proto3";

package workout.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/gym-chain/proto-go/workout/v1;workoutv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.workout.v1";

service WorkoutService {
  rpc LogWorkout(LogWorkoutRequest) returns (LogWorkoutResponse);
  rpc GetWorkout(GetWorkoutRequest) returns (WorkoutResponse);
  rpc GetWorkoutHistory(GetWorkoutHistoryRequest) returns (WorkoutHistoryResponse);
  rpc DeleteWorkout(DeleteWorkoutRequest) returns (google.protobuf.Empty);

  rpc CreateTemplate(CreateTemplateRequest) returns (TemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (TemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (google.protobuf.Empty);
  rpc ListTemplates(ListTemplatesRequest) returns (TemplatesResponse);
  rpc GetTemplate(GetTemplateRequest) returns (TemplateResponse);

  rpc GetPersonalRecords(GetPRRequest) returns (PRListResponse);
}

message ExerciseSet {
  int32 set_number = 1;
  int32 reps = 2;
  double weight_kg = 3;
  int32 duration_seconds = 4;
  bool is_warmup = 5;
}

message ExerciseEntry {
  string exercise_name = 1;
  string muscle_group = 2;
  repeated ExerciseSet sets = 3;
  string notes = 4;
}

message LogWorkoutRequest {
  string gym_id = 1;
  string template_id = 2; // optional
  repeated ExerciseEntry exercises = 3;
  int32 duration_minutes = 4;
  string notes = 5;
}

message LogWorkoutResponse {
  string workout_id = 1;
  repeated string new_prs = 2;
  string message = 3;
}

message GetWorkoutRequest {
  string workout_id = 1;
}

message WorkoutResponse {
  string id = 1;
  string user_id = 2;
  string gym_id = 3;
  string template_id = 4;
  repeated ExerciseEntry exercises = 5;
  int32 duration_minutes = 6;
  string notes = 7;
  string logged_at = 8;
}

message GetWorkoutHistoryRequest {
  string user_id = 1;
  string month = 2; // "2024-12"
}

message WorkoutHistoryResponse {
  repeated WorkoutResponse workouts = 1;
}

message DeleteWorkoutRequest {
  string workout_id = 1;
}

message CreateTemplateRequest {
  string name = 1;
  string split_tag = 2;
  repeated ExerciseEntry exercises = 3;
}

message TemplateResponse {
  string template_id = 1;
  string user_id = 2;
  string name = 3;
  string split_tag = 4;
  repeated ExerciseEntry exercises = 5;
}

message UpdateTemplateRequest {
  string template_id = 1;
  string name = 2;
  string split_tag = 3;
  repeated ExerciseEntry exercises = 4;
}

message DeleteTemplateRequest {
  string template_id = 1;
}

message ListTemplatesRequest {
  string user_id = 1;
}

message TemplatesResponse {
  repeated TemplateResponse templates = 1;
}

message GetTemplateRequest {
  string template_id = 1;
}

message GetPRRequest {
  string user_id = 1;
}

message PersonalRecord {
  string exercise_name = 1;
  double max_weight_kg = 2;
  int32 max_reps = 3;
  double max_volume_kg = 4;
  string achieved_at = 5;
  string workout_id = 6;
}

message PRListResponse {
  repeated PersonalRecord records = 1;
}
