syntax = "proto3";

package notification.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/gym-chain/proto-go/notification/v1;notificationv1";
option java_multiple_files = true;
option java_package = "com.gym.proto.notification.v1";

service NotificationService {
  rpc GetMyNotifications(GetNotificationsRequest) returns (NotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (google.protobuf.Empty);

  rpc GetPreferences(google.protobuf.Empty) returns (PreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (PreferencesResponse);

  rpc RegisterDevice(RegisterDeviceRequest) returns (google.protobuf.Empty);
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (google.protobuf.Empty);

  rpc SendBulkNotification(BulkNotificationRequest) returns (BulkNotificationResponse);
}

message GetNotificationsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message NotificationMessage {
  string id = 1;
  string user_id = 2;
  string channel = 3;
  string event_type = 4;
  string title = 5;
  string body = 6;
  string status = 7;
  string sent_at = 8;
}

message NotificationsResponse {
  repeated NotificationMessage notifications = 1;
}

message MarkAsReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

message Preference {
  string channel = 1; // SMS, EMAIL, PUSH
  bool enabled = 2;
}

message PreferencesResponse {
  repeated Preference preferences = 1;
}

message UpdatePreferencesRequest {
  string user_id = 2;
  repeated Preference preferences = 1;
}

message RegisterDeviceRequest {
  string user_id = 1;
  string device_id = 2;
  string fcm_token = 3;
  string platform = 4; // IOS, ANDROID
}

message UnregisterDeviceRequest {
  string user_id = 1;
  string device_id = 2;
}

message BulkNotificationRequest {
  string title = 1;
  string body = 2;
  repeated string target_user_ids = 3;
}

message BulkNotificationResponse {
  int32 sent_count = 1;
}
