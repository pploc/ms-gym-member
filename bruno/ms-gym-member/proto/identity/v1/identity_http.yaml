type: google.api.Service
config_version: 3

http:
  rules:
    - selector: identity.v1.IdentityService.Register
      post: /api/v1/auth/register
      body: "*"
    - selector: identity.v1.IdentityService.Login
      post: /api/v1/auth/login
      body: "*"
    - selector: identity.v1.IdentityService.LoginWithGoogle
      post: /api/v1/auth/oauth/google
      body: "*"
    - selector: identity.v1.IdentityService.RefreshToken
      post: /api/v1/auth/refresh
      body: "*"
    - selector: identity.v1.IdentityService.Logout
      post: /api/v1/auth/logout
      body: "*"
    - selector: identity.v1.IdentityService.GetCurrentUser
      get: /api/v1/users/me
    - selector: identity.v1.IdentityService.ChangePassword
      post: /api/v1/users/password
      body: "*"
