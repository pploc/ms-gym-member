spring:
  application:
    name: ms-gym-member
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gym_member}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-gym-member-v1
      auto-offset-reset: earliest

server:
  port: 8080

grpc:
  server:
    port: ${GRPC_SERVER_PORT:50051}
    tls:
      enabled: ${MEMBER_GRPC_TLS_ENABLED:true}
      certificate-chain: ${MEMBER_GRPC_SERVER_CERT:}
      private-key: ${MEMBER_GRPC_SERVER_KEY:}
      client-ca: ${MEMBER_GRPC_CLIENT_CA:}

logging:
  level:
    root: INFO
    com.gym.member: DEBUG

app:
  member:
    require-event-id: ${MEMBER_REQUIRE_EVENT_ID:false}
    cron:
      expiry-check: "${CRON_EXPIRY_CHECK:0 0 6 * * *}"
      expiry-warning: "${CRON_EXPIRY_WARNING:0 0 9 * * *}"
    subscription:
      max-pause-count: ${SUBSCRIPTION_MAX_PAUSE_COUNT:2}
      warning-notice-days: ${SUBSCRIPTION_WARNING_NOTICE_DAYS:7}
      default-duration-days: ${SUBSCRIPTION_DEFAULT_DURATION_DAYS:30}
    outbox:
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      poll-delay: ${OUTBOX_POLL_DELAY:PT2S}
      retry-delay: ${OUTBOX_RETRY_DELAY:PT10S}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      lease-duration: ${OUTBOX_LEASE_DURATION:PT1M}
    payment:
      target: ${PAYMENT_GRPC_TARGET:}
      deadline: ${PAYMENT_GRPC_DEADLINE:PT3S}
      use-plaintext: ${PAYMENT_GRPC_USE_PLAINTEXT:true}

gym:
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    value-subject-name-strategy: io.confluent.kafka.serializers.subject.TopicNameStrategy
    auto-register-schemas: ${SCHEMA_AUTO_REGISTER:false}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:PT25S}
    dlq:
      suffix: .DLQ
    retry:
      enabled: true
      retry-count: ${KAFKA_RETRY_COUNT:3}
      initial-interval: ${KAFKA_RETRY_INITIAL_INTERVAL:PT2S}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-interval: ${KAFKA_RETRY_MAX_INTERVAL:PT8S}
    topics:
      user-registered: ${TOPIC_USER_REGISTERED:identity.user.registered.v1}
      payment-completed: ${TOPIC_PAYMENT_COMPLETED:payment.completed.v1}
      user-suspended: ${TOPIC_USER_SUSPENDED:identity.user.suspended.v1}
