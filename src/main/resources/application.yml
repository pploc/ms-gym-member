spring:
  application:
    name: ms-gym-member
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gym_member}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-gym-member-group-v3
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: com.gym.common.kafka.message.EventEnvelopeDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.gym.common.kafka.message.EventEnvelopeSerializer

server:
  port: 8080

grpc:
  server:
    port: 50051

logging:
  level:
    root: INFO
    com.gym.member: DEBUG

app:
  member:
    cron:
      qr-rotation: "${CRON_QR_ROTATION:0 0 0 * * *}"
      expiry-check: "${CRON_EXPIRY_CHECK:0 0 6 * * *}"
      expiry-warning: "${CRON_EXPIRY_WARNING:0 0 9 * * *}"
    subscription:
      max-pause-count: ${SUBSCRIPTION_MAX_PAUSE_COUNT:2}
      warning-notice-days: ${SUBSCRIPTION_WARNING_NOTICE_DAYS:7}
      default-duration-days: ${SUBSCRIPTION_DEFAULT_DURATION_DAYS:30}

gym:
  kafka:
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
    topics:
      user-registered: ${TOPIC_USER_REGISTERED:identity.user.registered}
      payment-completed: ${TOPIC_PAYMENT_COMPLETED:payment.completed}
