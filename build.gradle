plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
}

group = 'com.gym.member'
version = '1.0.0'

// Java 26 class files need JaCoCo ≥ 0.8.13
jacoco {
    toolVersion = '0.8.14'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

def gprUser = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: "pploc"
def gprKey = System.getenv("GITHUB_TOKEN") 
        ?: System.getenv("READ_PACKAGES_TOKEN") 
        ?: System.getenv("GPR_TOKEN") 
        ?: System.getenv("GPR_KEY") 
        ?: project.findProperty("gpr.key")

if (gprKey == null || gprKey.isEmpty()) {
    logger.quiet("WARNING: GitHub Packages token is NULL or EMPTY! Authentication to https://maven.pkg.github.com will fail with 401 Unauthorized.")
} else {
    logger.quiet("GitHub Packages auth: username='{}', token present (length={})", gprUser, gprKey.length())
}

repositories {
    mavenCentral()
    maven { url 'https://packages.confluent.io/maven/' }
    maven {
        url = uri("https://maven.pkg.github.com/pploc/gym-proto")
        credentials {
            username = gprUser
            password = gprKey
        }
        content {
            includeGroup 'com.gym.proto'
        }
    }
    maven {
        url = uri("https://maven.pkg.github.com/pploc/common-java")
        credentials {
            username = gprUser
            password = gprKey
        }
        content {
            includeGroup 'com.gym'
        }
    }
}

def mapstructVersion = '1.6.3'
def grpcVersion = '1.68.1'
def testcontainersVersion = '1.20.1'

dependencies {
    implementation 'com.gym:common-java:2.0.0'
    implementation 'com.gym.proto:gym-proto-java:2.0.0'
    implementation('com.google.protobuf:protobuf-java') {
        version { strictly '3.25.4' }
    }
    implementation('com.google.protobuf:protobuf-java-util') {
        version { strictly '3.25.4' }
    }
    implementation('com.google.api.grpc:proto-google-common-protos') {
        version { strictly '2.22.1' }
    }

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.retry:spring-retry:2.0.6'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    ['compileOnly', 'annotationProcessor', 'testCompileOnly', 'testAnnotationProcessor'].each {
        add(it, 'org.projectlombok:lombok')
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testRuntimeOnly 'com.h2database:h2'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
}

def jacocoExcludes = [
        'com/gym/member/MsGymMemberApplication.class',
        'com/gym/member/config/**',
        'com/gym/member/**/mapper/**',
        'com/gym/member/**/dto/**',
        'com/gym/member/**/event/**',
        'com/gym/member/**/model/**',
        'com/gym/member/**/exception/**',
        'com/gym/member/**/entity/**',
        'com/gym/member/**/specification/**',
        'com/gym/member/util/**'
]

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

afterEvaluate {
    [jacocoTestReport, jacocoTestCoverageVerification].each { task ->
        task.classDirectories.setFrom(files(task.classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.register('startEnv', Exec) {
    group = 'environment'
    description = 'Start local Docker testing environment (PostgreSQL, Kafka KRaft)'
    commandLine 'docker', 'compose', 'up', '-d'
}

tasks.register('stopEnv', Exec) {
    group = 'environment'
    description = 'Stop local Docker testing environment'
    commandLine 'docker', 'compose', 'down'
}

tasks.register('ensureLocalCerts', Exec) {
    group = 'environment'
    description = 'Generate local mTLS material under certs/local if missing'
    workingDir = projectDir
    commandLine 'sh', '-c', '''
set -eu
need=
for f in certs/local/server.crt certs/local/server.key certs/local/ca.crt \
         certs/local/client-postman.crt certs/local/client-postman.key; do
  if [ ! -f "$f" ]; then need=1; break; fi
done
if [ -n "$need" ]; then
  echo "Generating local mTLS certs under certs/local ..."
  ./scripts/generate-local-certs.sh
else
  echo "Local mTLS certs already present under certs/local"
fi
'''
}

tasks.named('bootRun') {
    dependsOn 'ensureLocalCerts'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        lineEndings 'UNIX'
    }
}

tasks.register('seedTestEvents', JavaExec) {
    group = 'environment'
    description = 'Publish mock identity.user.registered and payment.completed events to local Kafka'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gym.member.util.TestEventSeeder'
}
