plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
}

group = 'com.gym.member'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 26
}

def gprUser = project.findProperty("gpr.user") ?: System.getenv("GPR_USER") ?: System.getenv("GITHUB_ACTOR") ?: "pploc"
def gprKey = project.findProperty("gpr.key") ?: System.getenv("READ_PACKAGES_TOKEN") ?: System.getenv("GPR_TOKEN") ?: System.getenv("GITHUB_TOKEN")

if (gprKey == null || gprKey.isEmpty()) {
    logger.quiet("WARNING: GitHub Packages token is NULL or EMPTY! Authentication to https://maven.pkg.github.com will fail with 401 Unauthorized.")
} else {
    logger.quiet("GitHub Packages auth: username='{}', token present (length={})", gprUser, gprKey.length())
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://maven.pkg.github.com/pploc/gym-proto'
        credentials {
            username = gprUser
            password = gprKey
        }
    }
    maven {
        url 'https://maven.pkg.github.com/pploc/common-java'
        credentials {
            username = gprUser
            password = gprKey
        }
    }
}

dependencies {
    implementation 'com.gym:common-java:1.0.1' // local development resolves the updated event-envelope contract from mavenLocal()
    implementation 'com.gym.proto:gym-proto-java:1.0.2'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.retry:spring-retry:2.0.6'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'io.grpc:grpc-testing:1.68.1'
    testImplementation 'io.grpc:grpc-inprocess:1.68.1'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:postgresql:1.20.1'
    testImplementation 'org.testcontainers:kafka:1.20.1'
}

def jacocoExcludes = [
        'com/gym/member/MsGymMemberApplication.class',
        'com/gym/member/config/**',
        'com/gym/member/**/mapper/**',
        'com/gym/member/**/dto/**',
        'com/gym/member/**/event/**',
        'com/gym/member/**/model/**',
        'com/gym/member/**/exception/**',
        'com/gym/member/**/entity/**',
        'com/gym/member/util/**'
]

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.register('startEnv', Exec) {
    group = 'environment'
    description = 'Start local Docker testing environment (PostgreSQL, Kafka KRaft)'
    commandLine 'docker', 'compose', 'up', '-d'
}

tasks.register('stopEnv', Exec) {
    group = 'environment'
    description = 'Stop local Docker testing environment'
    commandLine 'docker', 'compose', 'down'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        lineEndings 'UNIX'
    }
}

tasks.register('seedTestEvents', JavaExec) {
    group = 'environment'
    description = 'Publish mock identity.user.registered and payment.completed events to local Kafka'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gym.member.util.TestEventSeeder'
}




